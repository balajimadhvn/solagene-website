<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071027" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Solagene" />
    <meta name="format-detection" content="telephone=no" />
    <!-- GitHub Pages cannot send security headers, so the policy is set here. No inline scripts are allowed (the theme
         script is /theme-init.js; JSON-LD is data, not script); 'wasm-unsafe-eval' lets RDKit, minimap2 and samtools
         (WebAssembly) run. frame-ancestors is ignored in a meta tag: see public/theme-init.js and public/_headers. Workbench studios fetch public
         APIs over https. Change form-action/connect-src only if a form backend on another scheme is added. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws: data: blob:; worker-src 'self' blob:; frame-src 'self' https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self' https: mailto:" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--head-->
    <title>Solagene: Biotechnology & Bioinformatics Company, Courses & Software</title>
    <meta name="description" content="Solagene is a biotechnology and bioinformatics company: Vedicgen courses and internships, Nayancode scientific software and research services." />
    <!--/head-->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
